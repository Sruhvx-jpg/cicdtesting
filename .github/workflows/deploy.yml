name: Deploy cicdtest on excloud learn-instance

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: deploy on excloud server
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: 210.79.129.39
                username: ubuntu
                key: ${{ secrets.PRIVATE_KEY }}
                script: | 
                    cd /home/ubuntu/cicdtesting
                    git pull
                    pnpm install
                    pm2 restart 0